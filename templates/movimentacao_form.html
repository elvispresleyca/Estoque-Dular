{% extends "base.html" %}
{% block title %}Nova Movimentação - Estoque{% endblock %}
{% block page_title %}Entrada ou Saída{% endblock %}

{% block content %}
<div class="max-w-xl">
    {% if error %}
    <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm">
        <i class="fas fa-exclamation-circle mr-2"></i>{{ error }}
    </div>
    {% endif %}

    <form method="post" class="bg-white rounded-xl shadow p-6 space-y-5">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Produto *</label>
            <select name="product_id" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                <option value="">Selecione o produto</option>
                {% for p in products %}
                <option value="{{ p.id }}">{{ p.sku }} — {{ p.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Local (Depósito ou Loja) *</label>
            <select name="location_id" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                <option value="">Selecione o local</option>
                <optgroup label="Depósitos">
                {% for loc in locations if loc.type.value == 'deposito' %}
                <option value="{{ loc.id }}">{{ loc.name }}</option>
                {% endfor %}
                </optgroup>
                <optgroup label="Lojas / Mostruários">
                {% for loc in locations if loc.type.value == 'loja' %}
                <option value="{{ loc.id }}">{{ loc.name }}</option>
                {% endfor %}
                </optgroup>
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Tipo *</label>
            <div class="flex gap-4">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="radio" name="type" value="entrada" required>
                    <span class="px-3 py-1.5 bg-green-50 text-green-700 rounded-lg text-sm">Entrada</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="radio" name="type" value="saida">
                    <span class="px-3 py-1.5 bg-red-50 text-red-700 rounded-lg text-sm">Saída</span>
                </label>
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Quantidade *</label>
            <input type="number" name="quantity" required min="1"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Observação</label>
            <textarea name="notes" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                placeholder="Ex: Compra fornecedor X, NF 12345..."></textarea>
        </div>

        <div class="flex gap-3 pt-2">
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-lg font-medium">Registrar</button>
            <a href="/movimentacoes" class="px-6 py-2.5 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
