{% extends "base.html" %}
{% block title %}Login - Estoque{% endblock %}

{% block auth_content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-900 to-blue-700">
    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-100 text-blue-700 text-3xl mb-4">
                <i class="fas fa-warehouse"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">Gestão de Estoque</h1>
            <p class="text-gray-500 mt-1">Acesse sua conta</p>
        </div>

        {% if error %}
        <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm">
            <i class="fas fa-exclamation-circle mr-2"></i>{{ error }}
        </div>
        {% endif %}

        <form method="post" action="/login" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Usuário</label>
                <input type="text" name="username" required autofocus
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                    placeholder="Digite seu usuário">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                <input type="password" name="password" required
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                    placeholder="Digite sua senha">
            </div>
            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition">
                Entrar
            </button>
        </form>

        <div class="mt-6 p-4 bg-gray-50 rounded-lg text-xs text-gray-600">
            <p class="font-medium mb-1">Contas de demonstração:</p>
            <p><strong>Admin:</strong> admin / admin123</p>
            <p><strong>Vendedora:</strong> maria / maria123</p>
        </div>
    </div>
</div>
{% endblock %}
