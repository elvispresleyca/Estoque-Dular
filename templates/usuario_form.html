{% extends "base.html" %}
{% block title %}Novo Usuário - Estoque{% endblock %}
{% block page_title %}Novo Usuário{% endblock %}

{% block content %}
<div class="max-w-md">
    {% if error %}
    <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm">
        <i class="fas fa-exclamation-circle mr-2"></i>{{ error }}
    </div>
    {% endif %}

    <form method="post" class="bg-white rounded-xl shadow p-6 space-y-5">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nome completo *</label>
            <input type="text" name="full_name" required
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                placeholder="Nome completo">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nome de usuário *</label>
            <input type="text" name="username" required
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                placeholder="usuario.login">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Senha *</label>
            <input type="password" name="password" required minlength="6"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                placeholder="Mínimo 6 caracteres">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Perfil *</label>
            <select name="role" required
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                <option value="vendedora">Vendedora</option>
                <option value="admin">Administrador</option>
            </select>
        </div>

        <div class="flex gap-3 pt-2">
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-lg font-medium">
                Criar usuário
            </button>
            <a href="/usuarios" class="px-6 py-2.5 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">
                Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
